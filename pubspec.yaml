name: dn_audio
description: "Premium offline music player by Digital Native Dev."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  just_audio: ^0.10.6
  package_info_plus: ^9.0.0
  path: ^1.9.1
  sqflite: ^2.4.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
